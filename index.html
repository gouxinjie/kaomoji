<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜文字图鉴 · 让表达更有趣</title>
    <meta name="description" content="151 大类精选颜文字，一键复制，让表达更有趣">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="container">
    <!-- 头部（由 app.js 渲染） -->
    <header class="site-header" id="site-header"></header>

    <!-- 移动端分类筛选按钮 -->
    <button type="button" class="mobile-filter-btn" id="mobile-filter-btn"
        aria-label="打开分类筛选" title="分类筛选"></button>

    <!-- Tab 切换（颜文字 / 图标，由 app.js 渲染） -->
    <nav class="tabs" id="tabs" role="tablist" aria-label="内容切换"></nav>

    <!-- 搜索框（由 app.js 渲染） -->
    <div id="search-bar"></div>

    <!-- 主体：侧边栏 + 内容区 -->
    <div class="layout">
        <!-- 侧边栏分类筛选（由 app.js 渲染） -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- 内容区 -->
        <div class="content">
            <!-- 分类卡片网格（由 app.js 渲染） -->
            <main class="grid" id="grid" role="tabpanel" aria-label="内容分类"></main>

            <!-- 底部特性区（由 app.js 渲染） -->
            <section class="features" id="features"></section>
        </div>
    </div>

    <!-- 页脚（由 app.js 渲染） -->
    <footer class="footer-note" id="footer-note"></footer>
</div>

<!-- Toast 提示 -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 数据：先于 app.js 加载 -->
<script src="./data.js"></script>
<script src="./icons.js"></script>
<!-- 逻辑 -->
<script src="./app.js"></script>

</body>
</html>
