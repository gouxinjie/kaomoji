<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜文字图鉴 · 让表达更有趣</title>
    <meta name="description" content="103 类精选颜文字、Emoji、特殊符号、汉字部首，一键复制，让表达更有趣">
    <!-- 网站图标：以经典颜文字 (◕‿◕) 为视觉核心的矢量 favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./favicon.svg">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="stylesheet" href="./styles.css?v=20260826">
</head>
<body>

<div class="container">
    <!-- 头部（由 app.js 渲染：品牌行 + 大标题 + 描述 + 分类chips + 搜索/Tab + 数据统计） -->
    <header class="site-header" id="site-header"></header>

    <!-- 移动端分类筛选按钮 -->
    <button type="button" class="mobile-filter-btn" id="mobile-filter-btn"
        aria-label="打开分类筛选" title="分类筛选"></button>

    <!-- 主体：侧边栏 + 内容区 -->
    <div class="layout">
        <!-- 侧边栏分类筛选（由 app.js 渲染） -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- 内容区 -->
        <div class="content">
            <!-- 分类卡片网格（由 app.js 渲染） -->
            <main class="grid" id="grid" role="tabpanel" aria-label="内容分类"></main>

            <!-- 底部特性区（由 app.js 渲染） -->
            <section class="features" id="features"></section>
        </div>
    </div>

    <!-- 页脚（由 app.js 渲染） -->
    <footer class="footer-note" id="footer-note"></footer>
</div>

<!-- Toast 提示 -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 数据：先于 app.js 加载 -->
<script src="./data/kaomoji.js"></script>
<script src="./data/icons.js"></script>
<script src="./data/symbols.js"></script>
<script src="./data/radicals.js"></script>
<!-- 逻辑 -->
<script src="./app.js"></script>

</body>
</html>
