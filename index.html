<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜文字图鉴 · 让表达更有趣</title>
    <meta name="description" content="131 类精选颜文字、Emoji、特殊符号、汉字部首、花字变体、装饰长串，一键复制，让表达更有趣">
    <!-- 网站图标：以经典颜文字 (◕‿◕) 为视觉核心的矢量 favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./favicon.svg">
    <!-- 关键 CSS（防止背景紫色闪烁） -->
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #f6f7fb;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            color: #2a2f3c;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body { padding: 20px 24px 40px; }
        /* JS 渲染前：所有由脚本填充的容器为空时隐藏，避免出现"空卡片"闪烁 */
        .site-header:empty,
        #sidebar:empty,
        #grid:empty,
        #features:empty,
        #footer-note:empty { display: none; }
        /* 页面加载中提示：居中显示，内容渲染完成后由 app.js 隐藏 */
        .page-loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #f6f7fb;
            color: #5b6478;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .page-loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid #e3e8f7;
            border-top-color: #4a7bff;
            border-radius: 50%;
            animation: loading-spin 0.9s linear infinite;
        }
        @keyframes loading-spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link rel="stylesheet" href="./styles.css?v=20260829">
</head>
<body>

<!-- 页面加载中提示：内容渲染完成后由 app.js 隐藏 -->
<div class="page-loading" id="page-loading" role="status" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <span class="loading-text">正在加载灵感库…</span>
</div>

<div class="container">
    <!-- 头部（由 app.js 渲染：品牌行 + 大标题 + 描述 + 分类chips + 搜索/Tab + 数据统计） -->
    <header class="site-header" id="site-header"></header>

    <!-- 移动端分类筛选按钮 -->
    <button type="button" class="mobile-filter-btn" id="mobile-filter-btn"
        aria-label="打开分类筛选" title="分类筛选"></button>

    <!-- 主体：侧边栏 + 内容区 -->
    <div class="layout">
        <!-- 侧边栏分类筛选（由 app.js 渲染） -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- 内容区 -->
        <div class="content">
            <!-- 分类卡片网格（由 app.js 渲染） -->
            <main class="grid" id="grid" role="tabpanel" aria-label="内容分类"></main>

            <!-- 底部特性区（由 app.js 渲染） -->
            <section class="features" id="features"></section>
        </div>
    </div>

    <!-- 页脚（由 app.js 渲染） -->
    <footer class="footer-note" id="footer-note"></footer>
</div>

<!-- Toast 提示 -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 数据：先于 app.js 加载，defer 让脚本并行下载、不阻塞渲染 -->
<script defer src="./data/kaomoji.js?v=20260829"></script>
<script defer src="./data/icons.js?v=20260829"></script>
<script defer src="./data/symbols.js?v=20260829"></script>
<script defer src="./data/radicals.js?v=20260829"></script>
<script defer src="./data/fancy.js?v=20260829"></script>
<script defer src="./data/deco.js?v=20260829"></script>
<!-- 逻辑 -->
<script defer src="./app.js?v=20260829"></script>

</body>
</html>
