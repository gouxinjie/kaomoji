# 颜文字图鉴 · 部署到阿里云 ECS
# 触发条件：推送 master 分支时自动部署
# 目标目录：/var/www/kaomoji
# 域名：kaomoji.gouxinjie.com (HTTP)
#
# 说明：私钥通过 base64 编码存入 Secret（ECS_SSH_PRIVATE_KEY），
#       runner 上用 base64 -d 解码成文件，彻底避免多行 PEM 换行/回车符导致的
#       "error in libcrypto" 问题。

name: Deploy to Aliyun ECS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: 部署到 ECS
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 解码 base64 私钥为 SSH 密钥文件
      #    先去除 secret 中可能混入的换行/回车/空格，再解码，避免 base64: invalid input
      - name: 准备 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_PRIVATE_KEY }}" | tr -d '\r\n ' > /tmp/deploy_key.b64
          base64 -d /tmp/deploy_key.b64 > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # 3. 通过 rsync 将文件部署到 ECS（手动控制，不使用 action 的密钥处理）
      - name: 通过 SSH/rsync 部署
        run: |
          rsync -avzO --delete \
            --rsh "ssh -p ${{ secrets.ECS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.github/' --exclude='.git/' --exclude='.gitignore' \
            --exclude='README.md' --exclude='LICENSE' --exclude='start.ps1' \
            --exclude='docs/' --exclude='.codebuddy/' \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:${{ secrets.ECS_TARGET }}/

      # 4. 部署完成后的验证
      - name: 验证部署
        run: |
          ssh -p ${{ secrets.ECS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} \
            "echo '部署完成，目录内容：' && ls -la ${{ secrets.ECS_TARGET }}"
