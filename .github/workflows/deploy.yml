# 颜文字图鉴 · 部署到阿里云 ECS
# 触发条件：推送 master 分支时自动部署
# 目标目录：/var/www/kaomoji
# 域名：kaomoji.gouxinjie.com (HTTP)
#
# 说明：ECS_SSH_PRIVATE_KEY 支持两种格式，自动识别：
#   - PEM 明文（-----BEGIN ...-----）：直接使用
#   - base64：先解码再使用
#   runner 上会统一清洗回车符，避免 "error in libcrypto"。

name: Deploy to Aliyun ECS

on:
  push:
    branches: [ master ]
  # 支持在 Actions 页面手动触发部署，便于首次初始化或排查问题
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到 ECS
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 准备 SSH 密钥文件（自动识别 PEM 明文 / base64）
      #    通过 env 传入 secret，避免多行内容在 run 块中被 shell 拆分
      - name: 准备 SSH 密钥
        env:
          KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" > /tmp/key_input
          if grep -q -- '-----BEGIN' /tmp/key_input; then
            echo "检测到 PEM 明文私钥，直接使用"
            sed 's/\r$//' /tmp/key_input > ~/.ssh/deploy_key
          else
            echo "检测到 base64 私钥，先解码"
            tr -d '\r\n ' < /tmp/key_input | base64 -d > ~/.ssh/deploy_key
          fi
          # 若结尾缺换行则补上，并校验密钥能被 ssh 正确解析
          [ -n "$(tail -c1 ~/.ssh/deploy_key)" ] && echo >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "密钥解析成功"

      # 3. 通过 rsync 将文件部署到 ECS（手动控制，不使用 action 的密钥处理）
      #    --no-o --no-g：非 root 部署用户无需也不应同步属主/组，避免 chown 失败
      - name: 通过 SSH/rsync 部署
        run: |
          rsync -avzO --no-o --no-g --delete \
            --rsh "ssh -p ${{ secrets.ECS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.github/' --exclude='.git/' --exclude='.gitignore' \
            --exclude='README.md' --exclude='LICENSE' --exclude='start.ps1' \
            --exclude='docs/' --exclude='.codebuddy/' \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:${{ secrets.ECS_TARGET }}/

      # 4. 部署完成后的验证：确认目录内容 + 站点 HTTP 可达
      - name: 验证部署
        run: |
          ssh -p ${{ secrets.ECS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} \
            "echo '部署完成，目录内容：' && ls -la ${{ secrets.ECS_TARGET }}"

      # 5. 健康检查：站点不可达则工作流失败，及时暴露部署问题
      - name: 检查站点可访问性
        run: |
          curl -fsS -o /dev/null --connect-timeout 10 --max-time 30 \
            -w "站点可访问：HTTP %{http_code}，耗时 %{time_total}s\n" \
            http://kaomoji.gouxinjie.com/
