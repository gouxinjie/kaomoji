# 颜文字图鉴 · Nginx 站点配置（HTTP）
# 部署目录：/var/www/kaomoji
# 域名：kaomoji.gouxinjie.com
#
# 使用方式：
#   sudo cp server_kaomoji.conf /etc/nginx/conf.d/server_kaomoji.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name kaomoji.gouxinjie.com;

    root /var/www/kaomoji;
    index index.html;

    # 静态资源缓存：HTML 不缓存，其余资源长缓存（带版本号 ?v=）
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 隐藏 Nginx 版本号（安全加固）
    server_tokens off;

    # 日志
    access_log /var/log/nginx/kaomoji.access.log;
    error_log  /var/log/nginx/kaomoji.error.log;
}
